<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LAVi-SPICA — 変数からNumPy・Matplotlibまで、ブラウザで学べるPython基礎学習アプリ。">
  <meta name="application-name" content="LAVi-SPICA">
  <meta name="theme-color" content="#0b1220">
  <title>LAVi-SPICA — Python基礎学習アプリ</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" as="image" href="./assets/lavi-spica-hero.png" fetchpriority="high">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">本文へ移動</a>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <button class="icon-button mobile-only" id="menuToggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar">☰</button>
      <a class="brand" href="#dashboard" aria-label="LAVi-SPICA ホーム">
        <img src="./assets/logo.svg" alt="" width="38" height="38">
        <span class="brand-copy"><strong>LAVi-SPICA</strong><small>Python基礎学習アプリ</small></span>
      </a>
      <div class="topbar-spacer"></div>
      <div class="runtime-pill" id="runtimePill" title="Python実行環境の状態">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="runtimeStatus">Pythonは実行時に準備</span>
      </div>
      <button class="icon-button" id="themeToggle" type="button" aria-label="配色を切り替える" title="配色を切り替える">◐</button>
    </header>

    <div class="shell-body">
      <aside class="sidebar" id="sidebar" aria-label="主ナビゲーション">
        <nav class="main-nav" id="mainNav">
          <a href="#dashboard" data-nav="dashboard"><span aria-hidden="true">⌂</span><span>ホーム</span></a>
          <a href="#lecture" data-nav="lecture"><span aria-hidden="true">▶</span><span>講義補助モード</span></a>
          <a href="#learn" data-nav="learn"><span aria-hidden="true">▤</span><span>学習コース</span></a>
          <a href="#practice" data-nav="practice"><span aria-hidden="true">⌨</span><span>練習問題</span></a>
          <a href="#library" data-nav="library"><span aria-hidden="true">⌘</span><span>資料・用語集</span></a>
          <a href="#progress" data-nav="progress"><span aria-hidden="true">◫</span><span>進捗・保存</span></a>
          <a href="#about" data-nav="about"><span aria-hidden="true">ⓘ</span><span>このアプリについて</span></a>
        </nav>
        <section class="sidebar-progress" aria-labelledby="sidebarProgressTitle">
          <div class="eyebrow" id="sidebarProgressTitle">学習進捗</div>
          <div class="progress-row"><span id="sidebarProgressText">0 / 23 lesson</span><strong id="sidebarProgressPercent">0%</strong></div>
          <div class="progress-track" aria-hidden="true"><span id="sidebarProgressBar"></span></div>
          <a href="#progress" class="text-link">詳細を見る →</a>
        </section>
        <div class="sidebar-version">学習データはこの端末に保存されます</div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

      <main id="mainContent" tabindex="-1">
        <div id="appView" class="view-container" aria-live="polite"></div>
      </main>
    </div>

    <footer class="app-footer">
      <span>LAVi-SPICA</span>
      <span>Structured Python Interactive Course and Activities</span>
      <a href="#about">動作と保存</a>
    </footer>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <dialog id="globalDialog" class="global-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header"><h2 id="dialogTitle">確認</h2><button class="icon-button" value="cancel" aria-label="閉じる">×</button></div>
      <div id="dialogBody" class="dialog-body"></div>
      <div id="dialogActions" class="dialog-actions"><button class="button secondary" value="cancel">閉じる</button></div>
    </form>
  </dialog>

  <noscript><p class="noscript">このアプリにはJavaScriptが必要です。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
